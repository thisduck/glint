<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="origin">
  <title>Choose a Drive folder · glint</title>
  <style>
    :root { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #17284c; background: #eaf0ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 20px; }
    main { width: min(100%, 29rem); padding: clamp(28px, 6vw, 52px); border: 1px solid #cbd8ee; border-radius: 20px; background: #f5f8ff; box-shadow: 0 10px 36px #152c600a; }
    .brand { display: flex; align-items: center; gap: 6px; font-size: 25px; letter-spacing: -.055em; }
    svg { width: 32px; height: 32px; }
    h1 { margin: 38px 0 12px; font-size: clamp(32px, 6vw, 42px); font-weight: 500; letter-spacing: -.055em; line-height: 1.08; }
    p { margin: 0; max-width: 32ch; font-size: 16px; line-height: 1.55; color: #4c6082; }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
        <ellipse cx="20" cy="15" rx="9" ry="11" fill="#d9e4ff"/>
        <path d="M7 15a13 14 0 0 0 26 0M20 29v6m-7 1h14m-11-20 4-6"/>
      </svg>
      glint
    </div>
    <h1>Choose a Drive folder</h1>
    <p role="status">Select the folder where glint should save this profile’s recordings.</p>
  </main>
<script>
  const config = /* GOOGLE_CONFIGURATION */ null;
  const statusText = document.querySelector('[role="status"]');
  function loadFailed() {
    statusText.textContent = "Google Picker could not load. Return to glint and choose your folder again.";
  }
  function openPicker() {
    gapi.load("picker", {
      onerror: loadFailed,
      callback() {
        const p = google.picker;
        const view = new p.DocsView(p.ViewId.FOLDERS).setIncludeFolders(true).setSelectFolderEnabled(true);
        new p.PickerBuilder().addView(view).setDeveloperKey(config.key)
          .setAppId(config.project).setOAuthToken(config.token).setOrigin(location.origin)
          .setCallback(async data => {
            if (data.action !== p.Action.PICKED && data.action !== p.Action.CANCEL) return;
            const id = data.docs?.[0]?.id || "";
            try {
              const response = await fetch(location.pathname + "?id=" + encodeURIComponent(id), {method:"POST"});
              if (id && !response.ok) throw Error();
              document.querySelector("h1").textContent = id ? "Continue in glint" : "Selection cancelled";
              statusText.textContent = id ? "You can close this tab and return to your recording studio." : "Return to glint to choose a folder.";
            } catch { loadFailed(); }
          }).build().setVisible(true);
      }
    });
  }
</script>
<script src="https://apis.google.com/js/api.js" onload="openPicker()" onerror="loadFailed()"></script>
</body>
</html>
