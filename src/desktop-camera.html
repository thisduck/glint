<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; img-src data:; style-src 'unsafe-inline'"
  />
  <title>Camera preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; font: 12px -apple-system, BlinkMacSystemFont, sans-serif; }

    .bubble {
      position: relative;
      width: 100vw;
      height: 100vh;
      border-radius: 50%;
      overflow: hidden;
      background: #24222d;
      box-shadow: inset 0 0 0 1px #24222d;
    }

    img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

    button {
      position: absolute;
      border: 1px solid #fff;
      color: #fff;
      background: #24222d;
      border-radius: 7px;
      display: grid;
      place-items: center;
      height: 24px;
      padding: 0;
      touch-action: none;
    }

    button svg { width: 14px; height: 14px; }

    #move {
      inset: 0;
      width: 100%;
      height: 100%;
      border: 2px solid #f7f0ff;
      border-radius: 50%;
      background: transparent;
      cursor: grab;
    }

    #move:active { cursor: grabbing; }

    #resize {
      bottom: max(2px, 10%);
      right: max(2px, 10%);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: nwse-resize;
      opacity: 0;
      animation: hint 3s step-end;
      transition: opacity 0.15s;
    }
    @keyframes hint { 0% { opacity: 0.5; } 100% { opacity: 0; } }

    .grip {
      position: absolute;
      top: 8%;
      display: grid;
      place-items: center;
      width: 32px;
      height: 19px;
      border-radius: 6px;
      background: #24222d;
      opacity: 0;
      pointer-events: none;
    }

    .bubble:hover .grip, .bubble:focus-within .grip,
    .bubble:hover #resize, .bubble:focus-within #resize { opacity: 1; animation: none; }
    @media (prefers-reduced-motion: reduce) { #resize { transition: none; } }
    button:focus-visible { outline: 2px solid #fff; outline-offset: -4px; }
  </style>
  <main class="bubble" aria-label="Camera preview">
    <img alt="" />
    <button id="move" type="button" title="Drag camera preview to move it" aria-label="Camera position. Drag or use arrow keys to move.">
      <span class="grip" aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="currentColor">
          <circle cx="4" cy="6" r="1" /><circle cx="8" cy="6" r="1" /><circle cx="12" cy="6" r="1" />
          <circle cx="4" cy="10" r="1" /><circle cx="8" cy="10" r="1" /><circle cx="12" cy="10" r="1" />
        </svg>
      </span>
    </button>
    <button id="resize" type="button" title="Drag diagonally to resize" aria-label="Camera size. Drag or use arrow keys to resize.">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 7V3h4m2 10h4V9M3 3l10 10" />
      </svg>
    </button>
  </main>
</html>
