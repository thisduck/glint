<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; img-src data:; style-src 'unsafe-inline'"
  />
  <title>glint recording controls</title>
  <style>
    * {
      box-sizing: border-box;
    }
    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      background: #20243a;
      color: #fff;
      padding: 10px 12px;
      font:
        13px -apple-system,
        BlinkMacSystemFont,
        sans-serif;
      user-select: none;
      -webkit-app-region: drag;
    }

    .controls,
    .camera,
    .status,
    button {
      display: flex;
      align-items: center;
    }

    .controls {
      gap: 8px;
      min-height: 36px;
    }
    .status {
      min-width: 99px;
      gap: 7px;
    }
    .status strong,
    .label {
      display: block;
      font-size: 11px;
    }
    time {
      font-size: 16px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .light {
      background: #ff807c;
      border-radius: 50%;
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
    }

    .paused .light {
      background: #f7c263;
    }

    button {
      justify-content: center;
      gap: 5px;
      min-height: 32px;
      padding: 6px 9px;
      border: 1px solid #54515f;
      border-radius: 8px;
      background: #393641;
      color: inherit;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    button,
    input {
      -webkit-app-region: no-drag;
    }
    button:hover {
      background: #4e4a59;
    }
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }
    button svg {
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
    }
    #pause {
      min-width: 78px;
    }
    #pause .play-icon,
    .paused #pause .pause-icon {
      display: none;
    }
    .paused #pause .play-icon {
      display: block;
    }
    #stop {
      background: #ffd8d4;
      border-color: #ffd8d4;
      color: #5f201f;
    }
    #stop:hover {
      background: #ffbcb6;
    }
    #hide {
      margin-left: auto;
    }
    .preview-summary {
      min-width: 0;
      flex: 1;
      cursor: grab;
    }
    .preview-summary p {
      margin: 0 0 2px;
      color: #ded8e7;
      font-size: 11px;
    }
    .preview-summary strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #start {
      background: #dbe1ff;
      border-color: #dbe1ff;
      color: #202957;
    }
    #start:hover {
      background: #eff2ff;
    }
    button:disabled {
      opacity: 0.65;
      cursor: default;
    }
    .preview-options {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      min-height: 39px;
      gap: 7px;
    }
    .preview-options [aria-pressed="true"] {
      border-color: #9fe0b4;
      background: #24452f;
      color: #e6ffee;
    }
    .preview-options [aria-pressed="false"] {
      border-style: dashed;
      color: #ded8e7;
    }
    .preview-options [aria-pressed="false"]:hover {
      background: #4e4a59;
    }
    .preview .camera {
      margin: 8px 0 0;
      padding: 8px 0 0;
      border: 0;
      border-top: 1px solid #54515f;
    }
    .preview .camera-control:last-child {
      flex: 1;
    }
    .preview #scale {
      width: min(100%, 175px);
    }

    .camera {
      gap: 10px;
      margin-top: 4px;
    }

    .camera-control {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    #position {
      position: relative;
      width: 73px;
      height: 29px;
      min-height: 0;
      padding: 0;
      touch-action: none;
      cursor: crosshair;
      background: #171620;
      border-color: #7c7788;
      border-radius: 5px;
      overflow: hidden;
    }

    #position b {
      position: absolute;
      border-radius: 50%;
      background: #c2cbff center / cover;
      box-shadow: 0 0 0 1px #171620;
      pointer-events: none;
    }

    #scale {
      width: 102px;
      height: 29px;
      margin: 0;
      accent-color: #c2cbff;
    }
    output {
      color: #ded8e7;
      font-variant-numeric: tabular-nums;
    }
    .help {
      margin: 6px 0 0;
      color: #ded8e7;
      font-size: 11px;
    }
    /* Compact icon-first single row */
    body { padding: 8px 8px; overflow: hidden; }
    .sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .controls { gap: 5px; min-height: 36px; flex-wrap: nowrap; }
    .status { min-width: 0; gap: 6px; padding: 0 4px; flex: 1; }
    button { min-height: 32px; min-width: 32px; padding: 0 8px; gap: 4px; }
    button.icon { width: 32px; padding: 0; }
    button svg { width: 15px; height: 15px; }
    #pause { min-width: 32px; }
    #hide { margin-left: 0; }
    .tools[aria-expanded="true"] { background: #4e4a59; border-color: #c2cbff; }
    .tools[aria-expanded="true"] svg { transform: rotate(180deg); }
    .preview-summary { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; overflow: hidden; }
    .preview-summary strong { font-size: 12px; min-width: 0; }
    .tip { flex: 0 0 auto; display: inline-flex; color: #ded8e7; }
    .tip svg { width: 14px; height: 14px; }
    .tip.on { color: #9fe0b4; }
    #start { padding: 0 10px; }
    #mic[aria-pressed="true"], #camera-toggle[aria-pressed="true"] { border-color: #9fe0b4; background: #24452f; color: #e6ffee; }
    #mic[aria-pressed="false"], #camera-toggle[aria-pressed="false"] { border-style: dashed; color: #ded8e7; }
    .camera, .preview .camera { margin: 8px 0 0; padding: 8px 0 0; border-top: 1px solid #54515f; gap: 10px; flex-wrap: nowrap; min-width: 0; }
    .camera-control { min-width: 0; }
    #scale, .preview #scale { width: 100%; max-width: 175px; }
    .camera-control:last-child { flex: 1; }
  </style>
  <body>
    <main aria-label="Recording controls">
      <div id="preview-controls" hidden>
        <div class="controls">
          <button id="back" class="icon" data-command="cancel" type="button" title="Back to studio (Esc)" aria-label="Back to studio">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>
          </button>
          <div class="preview-summary">
            <span class="sr">Recording preview</span>
            <strong id="source-name"></strong>
            <span id="system-audio" class="tip" role="img"></span>
          </div>
          <button id="mic" class="icon" data-command="toggleMic" type="button" aria-pressed="false" aria-label="Microphone off" title="Microphone off"></button>
          <button id="camera-toggle" class="icon" data-command="toggleCamera" type="button" aria-pressed="false" aria-label="Camera off" title="Camera off"></button>
          <button class="icon tools" type="button" aria-expanded="false" aria-controls="camera-tools" title="Camera position and size" aria-label="Camera position and size" hidden>
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
          </button>
          <button id="start" data-command="start" type="button" title="Start recording" aria-label="Start recording">
            Start
          </button>
        </div>
      </div>
      <div class="controls" id="recording-controls">
        <div class="status">
          <span class="light" aria-hidden="true"></span>
          <div>
            <strong id="status" class="sr" role="status">Recording</strong>
            <time aria-label="Elapsed recording time">0:00</time>
          </div>
        </div>
        <button id="pause" class="icon" data-command="toggle" type="button" title="Pause" aria-label="Pause">
          <svg
            class="pause-icon"
            viewBox="0 0 16 16"
            fill="currentColor"
            aria-hidden="true"
          >
            <rect x="4" y="3" width="3" height="10" rx="1" />
            <rect x="9" y="3" width="3" height="10" rx="1" />
          </svg>
          <svg
            class="play-icon"
            viewBox="0 0 16 16"
            fill="currentColor"
            aria-hidden="true"
          >
            <path d="M5 3v10l8-5z" />
          </svg>
          <span class="sr">Pause</span>
        </button>
        <button id="restart" class="icon" data-command="restart" type="button" title="Restart recording (discards this take)" aria-label="Restart recording">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8a4.5 4.5 0 1 0 1.4-3.3"/><path d="M3.5 2.5v2.5H6"/></svg>
          <span class="sr">Restart recording</span>
        </button>
        <button id="stop" class="icon" data-command="stop" type="button" title="Stop recording" aria-label="Stop recording">
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <rect x="3" y="3" width="10" height="10" rx="2" />
          </svg>
          <span class="sr">Stop recording</span>
        </button>
        <button class="icon tools" type="button" aria-expanded="false" aria-controls="camera-tools" title="Camera position and size" aria-label="Camera position and size" hidden>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
        </button>
        <button id="hide" class="icon" data-command="hide" type="button" aria-describedby="restore-help" title="Hide controls (reopen from the glint menu bar icon)" aria-label="Hide controls">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3.5 8h9"/></svg>
        </button>
      </div>
      <section class="camera" id="camera-tools" aria-label="Camera controls" hidden>
        <div class="camera-control">
          <span class="label">Camera position</span>
          <button
            id="position"
            type="button"
            title="Drag here or use the arrow keys"
            aria-label="Camera position"
            aria-describedby="camera-help"
          >
            <b></b>
          </button>
        </div>
        <label class="camera-control">
          <span class="label"
            >Camera size <output aria-hidden="true">23%</output></span
          >
          <input
            id="scale"
            type="range"
            min="10"
            max="48"
            value="23"
            list="size-stops"
            aria-label="Camera size"
            aria-valuetext="Medium, 23%"
          />
          <datalist id="size-stops">
            <option value="15" label="S"></option>
            <option value="23" label="M"></option>
            <option value="36" label="L"></option>
          </datalist>
        </label>
      </section>
    </main>
    <p class="help sr" id="restore-help">
      Drag to move · Reopen from the glint menu bar icon.
    </p>
    <p class="help sr" id="camera-help" hidden>
      Drag the camera or use the position control with the arrow keys.
    </p>
  </body>
</html>
