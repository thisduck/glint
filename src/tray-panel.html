<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:">
<meta name="color-scheme" content="light dark">
<title>glint recording controls</title>
<style>
:root{--bg:#f6f8fc;--fg:#141a26;--muted:#5b6578;--line:#dfe4ee;--accent:#2f5bea;--accent-fg:#fff;--track:#c9d0dd;--row-hover:#e9eefb;--field:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#161b26;--fg:#e8ecf4;--muted:#98a2b6;--line:#2a3243;--accent:#5b82ff;--track:#3a4357;--row-hover:#1f2738;--field:#1d2433}}
*{box-sizing:border-box}
html,body{margin:0;width:100%;background:var(--bg);color:var(--fg);font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
html,body{max-height:100vh}
body{overflow-y:auto;-webkit-user-select:none;user-select:none}
#main{padding:8px}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 8px}
header h1{margin:0;font-size:13px;font-weight:600}
#clock{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600}
.group{border-top:1px solid var(--line);padding-top:4px;margin-top:4px}
.group-title{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:4px 6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px;padding:3px 6px;border-radius:6px}
.row[data-id="camera"],.row[data-id="screenQuality"],#ctl-open{border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.row:hover{background:var(--row-hover)}
.row label{flex:1}
.row.disabled{opacity:.5}
select{background:var(--field);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:2px 4px;font:inherit;max-width:150px}
.switch{appearance:none;-webkit-appearance:none;width:30px;height:18px;border-radius:9px;background:var(--track);position:relative;margin:0;cursor:pointer;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(12px)}
button.action{width:100%;text-align:left;background:none;border:0;color:var(--fg);font:inherit;padding:6px;border-radius:6px;cursor:pointer}
button.action:hover{background:var(--row-hover)}
button.primary{background:var(--accent);color:var(--accent-fg);text-align:center;font-weight:600;margin:4px 0}
button.primary:hover{background:var(--accent);filter:brightness(1.08)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div id="main" role="region" aria-label="glint recording controls">
<header><h1 id="title">glint</h1><span id="clock" aria-live="off"></span></header>
<div id="rows"></div>
</div>
</body>
</html>
